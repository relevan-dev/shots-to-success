[project]
name = "shots-to-success"
version = "0.1.0"
description = "A benchmark that measures how many search attempts an LLM agent needs to retrieve relevant documents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
dependencies = [
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sts = "shots_to_success.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shots_to_success"]

[tool.pytest.ini_options]
testpaths = ["tests"]
